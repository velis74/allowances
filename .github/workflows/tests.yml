name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: "Django ${{ matrix.django }} · Python ${{ matrix.python }} · ${{ matrix.db }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 5.2 is the current LTS and the lowest version supported.
          - { python: "3.11", django: "5.2", db: postgres }
          # Django 6.x requires Python 3.12 or newer, which is why the floor above stays on 3.11.
          - { python: "3.12", django: "6.0", db: postgres }
          - { python: "3.13", django: "6.1", db: postgres }
          # Both engines are supported, so both are proven — including the concurrency tests, which
          # is the whole point. Ends of the version range only; nothing in between is engine-specific.
          - { python: "3.11", django: "5.2", db: sqlite }
          - { python: "3.13", django: "6.1", db: sqlite }

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allowances
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "Django~=${{ matrix.django }}.0"

      - name: Report the versions actually resolved
        run: python -c "import django, sys; print('Django', django.get_version(), '· Python', sys.version)"

      - name: Write test database credentials
        # tests/settings.py falls back to SQLite when tests/env.py is absent, so the SQLite jobs
        # skip this step entirely. The file is gitignored because it holds per-developer Postgres
        # credentials; CI supplies its own.
        if: matrix.db == 'postgres'
        run: |
          cat > tests/env.py <<'PY'
          DATABASE = dict(
              ENGINE="django.db.backends.postgresql",
              NAME="allowances",
              USER="postgres",
              PASSWORD="postgres",
              HOST="localhost",
              PORT=5432,
              TEST=dict(NAME="test_allowances"),
          )
          PY

      - name: Test
        env:
          ALLOWANCES_TEST_DB: ${{ matrix.db }}
        run: coverage run -m pytest -q

      - name: Generate coverage report
        if: matrix.python == '3.13' && matrix.django == '6.1' && matrix.db == 'postgres'
        run: coverage json

      - name: Incremental coverage check
        if: matrix.python == '3.13' && matrix.django == '6.1' && matrix.db == 'postgres'
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: coverage.json

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install
      - run: npm run docs:build
