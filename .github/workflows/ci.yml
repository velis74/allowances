name: CI

# Pull requests run every job; pushes run them only on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: "python (Django ${{ matrix.django }} · Python ${{ matrix.python }} · ${{ matrix.db }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 6.x requires Python 3.12 or newer.
          - { python: "3.11", django: "5.2", db: postgres }
          - { python: "3.12", django: "6.0", db: postgres }
          - { python: "3.13", django: "6.1", db: postgres }
          - { python: "3.11", django: "5.2", db: sqlite }
          - { python: "3.13", django: "6.1", db: sqlite }

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allowances
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # uv.lock pins one Django version; the matrix leg installs its Django series over it.
        run: |
          uv sync --locked
          uv pip install "Django~=${{ matrix.django }}.0"

      - name: Report installed versions
        run: uv run --no-sync python -c "import django, sys; print('Django', django.get_version(), '· Python', sys.version)"

      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

      - name: Generated adorm models are up to date
        run: >-
          uv run --no-sync adorm generate --check --settings tests.settings
          --output allowances_adorm/models --line-length 120 allowances

      - name: Write test database credentials
        # tests/settings.py uses SQLite when tests/env.py (gitignored) is absent.
        if: matrix.db == 'postgres'
        run: |
          cat > tests/env.py <<'PY'
          DATABASE = dict(
              ENGINE="django.db.backends.postgresql",
              NAME="allowances",
              USER="postgres",
              PASSWORD="postgres",
              HOST="localhost",
              PORT=5432,
              TEST=dict(NAME="test_allowances"),
          )
          PY

      - name: Test
        env:
          ALLOWANCES_TEST_DB: ${{ matrix.db }}
        run: uv run --no-sync coverage run -m pytest -q

      - run: uv build

      - run: uv run --no-sync coverage json
        if: matrix.python == '3.13' && matrix.django == '6.1' && matrix.db == 'postgres'
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.json
        # The incremental coverage check reads the report of one matrix leg.
        if: matrix.python == '3.13' && matrix.django == '6.1' && matrix.db == 'postgres'

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:build

  coverage:
    name: Incremental coverage check
    runs-on: ubuntu-latest
    needs: [python]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: python-coverage

      - name: Incremental coverage check
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: coverage.json
          # Lint and docs tooling: no test measures it.
          extra-ignore-patterns: |
            scripts/**
            docs/**
          base-ref: ${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
