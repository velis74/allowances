[project]
name = "allowances"
version = "0.2.1"
description = "Grants and consumable budgets — enforced before the fact, auditable after it. Storage-agnostic, with a Django backend."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["licensing", "entitlements", "quota", "metering", "billing", "ledger", "django"]
# The core has no dependencies at all. `import allowances` pulls in nothing but the standard library.
dependencies = []

[project.urls]
# PyPI renders these in the sidebar, and gives Homepage/Documentation/Source/Issues their own icons
# when named exactly like this. Without them the only way off the project page is the README's own
# links, which is what this section exists to fix.
Homepage = "https://github.com/velis74/allowances"
Documentation = "https://docs.velis.si/allowances"
Source = "https://github.com/velis74/allowances"
Issues = "https://github.com/velis74/allowances/issues"

[project.optional-dependencies]
# Floor: 5.2, the current LTS — 5.1 reached end of life in December 2025 and nothing here needs an
# API newer than Django 3.1 anyway. Ceiling: the 6.x series, tested against 6.0 and 6.1 in CI.
django = ["Django>=5.2,<7"]
test = ["pytest", "pytest-django", "psycopg2-binary", "coverage", "Django>=5.2,<7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["allowances*", "allowances_django*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# pytest-django resolves the settings module before pytest inserts rootdir into sys.path, so a bare
# `pytest` would not find `tests.settings` without this. `python -m pytest` happens to work either way.
pythonpath = ["."]
python_files = "test_*.py"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Markdown is excluded because ruff formats Python blocks embedded in it, and documentation snippets
# are wrapped for reading rather than to a formatter's line budget.
exclude = ["*/migrations/*", "*.md", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731", "E722"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
source = ["allowances", "allowances_django"]
branch = true

[tool.coverage.report]
show_missing = true
