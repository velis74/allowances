[project]
name = "allowances"
version = "0.5.1"
description = "Grants and consumable budgets, checked before an operation and recorded in an append-only ledger, and an alternative permissions implementation. Storage-agnostic, with a Django backend."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jure Erznožnik", email = "jure.erznoznik@velis.si" }]
keywords = ["licensing", "entitlements", "quota", "metering", "billing", "ledger", "django"]
# The core imports only the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/velis74/allowances"
Repository = "https://github.com/velis74/allowances"
Issues = "https://github.com/velis74/allowances/issues"
Documentation = "https://docs.velis.si/allowances"

[project.optional-dependencies]
# Django 5.2 (LTS) to 6.x; CI tests 5.2, 6.0 and 6.1.
django = ["Django>=5.2,<7"]
# The adorm store (allowances_adorm). adorm[asyncpg] adds the native PostgreSQL driver.
adorm = ["adorm[django]>=0.1,<0.2"]

[dependency-groups]
dev = [
    "Django>=5.2,<7",
    "adorm[asyncpg,django]>=0.1,<0.2",
    "pytest",
    "pytest-asyncio",
    "pytest-django",
    # psycopg 3: adorm's native PostgreSQL driver needs Django's PostgreSQL backend on psycopg 3.
    "psycopg[binary]",
    "coverage",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Three top-level packages in the repository root: the core, the Django backend and the adorm store.
module-name = ["allowances", "allowances_django", "allowances_adorm"]
module-root = ""

[tool.publish]
tests = "pytest"
additional_files = ["allowances/__init__.py"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# pytest-django imports the settings module before pytest adds rootdir to sys.path; without this a bare
# `pytest` cannot import `tests.settings`.
pythonpath = ["."]
python_files = "test_*.py"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
# Markdown is excluded: ruff would format the Python code blocks in the documentation.
# Generated adorm models are checked by `adorm generate --check`, not formatted by ruff.
exclude = ["*/migrations/*", "*.md", "node_modules", "allowances_adorm/models/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731", "E722"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
source = ["allowances", "allowances_django", "allowances_adorm"]
omit = ["allowances_adorm/models/*"]
branch = true

[tool.coverage.report]
show_missing = true
